<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>2 октября</title>
<style>
  :root {
    --bg: #f6efe9;
    --card: #fffaf6;
    --ink: #3b2f33;
    --ink2: #8a7a7f;
    --pink: #e9b8c3;
    --pink-deep: #c9788b;
    --blue: #aac6e8;
    --line: #eadbd3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    background:
      radial-gradient(60vmax 60vmax at 110% -10%, #dfe9f6 0, transparent 60%),
      radial-gradient(50vmax 50vmax at -20% 110%, #f7dde3 0, transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px calc(40px + env(safe-area-inset-bottom)); }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink2); margin-bottom: 18px; }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--pink-deep); }
  .wallet-btn { border: 0; background: none; color: var(--pink-deep); font: inherit; padding: 4px 0; cursor: pointer; }

  .card { background: var(--card); border-radius: 22px; padding: 22px 18px; box-shadow: 0 1px 0 #fff inset, 0 10px 30px -18px rgba(0, 0, 0, .18); animation: rise .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .kicker { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--pink-deep); margin: 0 0 6px; }
  h1, h2 { font-family: ui-serif, "New York", Georgia, serif; font-weight: 500; line-height: 1.15; margin: 0 0 12px; }
  h1 { font-size: 34px; }
  h2 { font-size: 26px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--ink2); font-size: 15px; }

  .media { margin: 4px -6px 16px; border-radius: 16px; overflow: hidden; background: #efe4de; }
  .media img, .media video { display: block; width: 100%; max-height: 70dvh; object-fit: contain; background: #000; }
  .media img { background: none; }
  .ph { aspect-ratio: 4 / 5; display: grid; place-items: center; color: var(--ink2); font-size: 14px; text-align: center; padding: 20px; }

  textarea, input {
    width: 100%; font: inherit; color: var(--ink); background: #fff;
    border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; outline: none;
  }
  textarea { min-height: 84px; resize: vertical; }
  textarea:focus, input:focus { border-color: var(--pink); }
  input.code { font-size: 28px; letter-spacing: .4em; text-align: center; padding: 10px; }
  .btn {
    display: block; width: 100%; margin-top: 12px; border: 0; border-radius: 14px; padding: 15px;
    font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1; color: #fff; background: var(--pink-deep); cursor: pointer;
    transition: transform .12s, opacity .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .45; }
  .msg { min-height: 22px; margin-top: 10px; font-size: 15px; color: var(--pink-deep); text-align: center; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .reward { text-align: center; padding: 8px 0 0; }
  .reward h2 { font-size: 30px; }
  .coupon {
    position: relative; margin: 14px auto 4px; max-width: 300px; padding: 16px; border-radius: 14px;
    border: 2px dashed var(--pink); background: #fff6f8; font-family: ui-serif, Georgia, serif; font-size: 22px;
  }
  .coupon small { display: block; font: 13px -apple-system, sans-serif; color: var(--ink2); margin-bottom: 4px; letter-spacing: .06em; text-transform: uppercase; }

  .foil { position: absolute; left: -2px; top: -2px; border-radius: 14px; touch-action: none; cursor: pointer; transition: opacity .4s; }
  .foil.gone { opacity: 0; }
  .letter { width: 64px; height: 64px; margin: 18px auto 6px; display: grid; place-items: center; border-radius: 14px; background: var(--ink); color: #fff; font: 500 34px ui-serif, Georgia, serif; }
  .note { min-height: 44px; margin: 12px 0 0; text-align: center; color: var(--pink-deep); font-size: 15px; }
  h3 { font: 500 21px/1.2 ui-serif, "New York", Georgia, serif; margin: 0 0 10px; }
  #game button { -webkit-tap-highlight-color: transparent; }

  .mem { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .mc { min-height: 96px; padding: 8px 6px; border: 0; border-radius: 14px; background: var(--pink-deep); color: #fff; font-family: inherit; font-size: 13px; line-height: 1.25; cursor: pointer; }
  .mc::before { content: '♡'; font-size: 28px; }
  .mc span { display: none; }
  .mc.open, .mc.got { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); animation: flip .3s; }
  .mc.open::before, .mc.got::before { content: none; }
  .mc.open span, .mc.got span { display: block; }
  .mc.q.open, .mc.q.got { background: #fff6f8; }
  .mc.a span { font: 17px/1.15 ui-serif, Georgia, serif; }
  .mc.got { box-shadow: inset 0 0 0 2px var(--pink); }
  @keyframes flip { 50% { transform: scaleX(0); } }

  .opt { display: block; width: 100%; min-height: 48px; margin-top: 8px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); font-family: inherit; font-size: 16px; line-height: 1.3; text-align: left; cursor: pointer; transition: opacity .3s, background .3s, border-color .3s; }
  .opt.no { opacity: .3; text-decoration: line-through; }
  .opt.yes { background: #fff6f8; border-color: var(--pink-deep); opacity: 1; }

  .pz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; aspect-ratio: 4 / 3; margin: 4px -6px 0; border-radius: 16px; overflow: hidden; transition: gap .5s; }
  .pz.whole { gap: 0; }
  .pt { border: 0; padding: 0; background-size: 300% 300%; cursor: pointer; }
  .pt.sel { box-shadow: inset 0 0 0 4px var(--pink-deep); }

  .heart { display: grid; justify-items: center; margin: 8px auto 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; cursor: pointer; }
  .heart svg { width: 200px; height: 200px; transition: transform .3s; }
  .heart.on svg { transform: scale(1.07); }

  .slots, .tiles { display: flex; justify-content: center; gap: 8px; margin: 14px 0; }
  .lt { display: grid; place-items: center; width: 52px; height: 58px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font: 500 28px ui-serif, Georgia, serif; cursor: pointer; }
  .lt[disabled] { opacity: .12; }
  .lt.slot { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }

  .list { list-style: none; padding: 0; margin: 0 0 16px; }
  .list li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border: 0; }
  .list b { display: block; font-size: 13px; color: var(--ink2); font-weight: 500; }

  .sheet { position: fixed; inset: 0; background: rgba(59, 47, 51, .35); display: none; align-items: flex-end; z-index: 5; }
  .sheet.open { display: flex; }
  .sheet .card { width: 100%; max-width: 480px; margin: 0 auto; border-radius: 22px 22px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom)); max-height: 80dvh; overflow: auto; }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--r)); } }
  @media (prefers-reduced-motion: reduce) { .card, .confetti i { animation: none; } .confetti { display: none; } }
</style>
</head>

const KEY = 'dr-2026-10-02';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
const S = load() || { i: 0, answers: {}, coupons: [], phase: 'ask' };
S.letters ||= [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const LETTERS = FLOW.filter(x => x.letter).length;

async function sha(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

function media(it) {
  let h = '';
  if (it.video) h += `<div class="media"><video src="${it.video}" controls playsinline preload="metadata"
      onerror="this.parentNode.innerHTML='<div class=ph>Здесь будет видео</div>'"></video></div>`;
  if (it.photo) h += `<div class="media"><img src="${it.photo}" alt=""
      onerror="this.parentNode.innerHTML='<div class=ph>Здесь будет фото</div>'"></div>`;
  return h;
}

function bar(it) {
  const steps = FLOW.filter(x => x.type !== 'intro' && x.type !== 'final');
  const done = FLOW.slice(0, S.i).filter(x => x.type !== 'intro' && x.type !== 'final').length;
  const dots = steps.map((_, k) => `<i class="${k < done ? 'on' : ''}"></i>`).join('');
  const w = S.coupons.length ? `<button class="wallet-btn" onclick="openWallet()">Купоны · ${S.coupons.length}</button>` : '';
  return `<div class="top"><span>${esc(it.part || '')}</span><div class="dots">${dots}</div>${w}</div>`;
}

function codeBox(label) {
  return `<p class="muted">${label}</p>
    <input class="code" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····">
    <button class="btn" id="go">Открыть</button><div class="msg" id="msg"></div>`;
}

function render() {
  const it = FLOW[S.i];
  window.scrollTo(0, 0);
  let h = '';

  if (it.type === 'intro') {
    h = `<div class="card"><p class="kicker">2 октября</p><h1>${esc(it.title)}</h1><p>${esc(it.text)}</p>
      <button class="btn" onclick="next()">${esc(it.btn)}</button></div>`;
  }

  if (it.type === 'step') {
    h = bar(it) + '<div class="card">' + media(it) + `<h2>${esc(it.q)}</h2>`;
    if (S.phase === 'ask') {
      h += `<textarea id="ans" placeholder="Напиши здесь">${esc(S.answers[it.id] || '')}</textarea>
        <button class="btn" id="send">Ответить</button>`;
    } else if (S.phase === 'code') {
      h += `<p><i>«${esc(S.answers[it.id])}»</i></p>` + codeBox('Записал. Теперь код, он у меня.');
    } else {
      h += reward(it);
    }
    h += '</div>';
  }

  if (it.type === 'gate') {
    h = bar(it) + `<div class="card"><h2>${esc(it.title)}</h2><p>${esc(it.text)}</p>` + codeBox('Код:') + '</div>';
  }

  if (it.type === 'show') {
    h = bar(it) + '<div class="card">' + (it.kicker ? `<p class="kicker">${esc(it.kicker)}</p>` : '') +
      (it.title ? `<h2>${esc(it.title)}</h2>` : '') + media(it) + (it.text ? `<p>${esc(it.text)}</p>` : '');
    if (it.coupon) h += `<div class="coupon" data-scratch><small>Купон</small>${esc(it.coupon)}</div>`;
    h += `<button class="btn" onclick="next()">${esc(it.btn || 'Әрі қарай')}</button></div>`;
  }

  if (GAMES[it.type]) {
    h = bar(it) + '<div class="card">' + (S.phase === 'done' ? reward(it) :
      `<p class="kicker">${esc(it.kicker)}</p><h2>${esc(it.title)}</h2><p class="muted">${esc(it.text)}</p><div id="game"></div>`) + '</div>';
  }

  if (it.type === 'final') {
    const answers = FLOW.filter(x => x.q && S.answers[x.id])
      .map(x => `<li><b>${esc(x.q)}</b>${esc(S.answers[x.id])}</li>`).join('');
    h = `<div class="card"><p class="kicker">2 октября</p><h1>${esc(it.title)}</h1>
      ${S.coupons.length ? `<p class="kicker" style="margin-top:18px">Твои купоны</p>` + S.coupons.map(c => `<div class="coupon">${esc(c)}</div>`).join('') : ''}
      ${answers ? `<p class="kicker" style="margin-top:22px">Твои ответы сегодня</p><ul class="list">${answers}</ul>` : ''}
      </div>`;
  }

  app.innerHTML = h;
  if (GAMES[it.type] && S.phase !== 'done') GAMES[it.type](it, document.getElementById('game'));
  bind(it);
}

function reward(it) {
  const n = S.letters.indexOf(it.letter) + 1;
  return `<div class="reward">
    ${it.rewardTitle ? `<h2>${esc(it.rewardTitle)}</h2>` : ''}
    ${it.rewardPhoto ? media({ photo: it.rewardPhoto }) : ''}
    ${it.coupon ? `<div class="coupon" data-scratch><small>Купон</small>${esc(it.coupon)}</div>` : ''}
    ${it.rewardText ? `<p class="muted">${esc(it.rewardText)}</p>` : ''}
    ${n ? `<div class="letter">${esc(it.letter)}</div><p class="muted">Буква ${n} из ${LETTERS}.${n === 1 ? ' Вечером соберёшь из них слово.' : ''}</p>` : ''}
    <button class="btn" onclick="next()">Әрі қарай</button></div>`;
}

// Кладёт купон и букву шага в копилку. Повторный вызов ничего не дублирует.
function collect(it) {
  if (it.coupon && !S.coupons.includes(it.coupon)) S.coupons.push(it.coupon);
  if (it.letter && !S.letters.includes(it.letter)) S.letters.push(it.letter);
}

function win(it) { confetti(); collect(it); S.phase = 'done'; save(); render(); }

// Каждая игра рисует себя в box и зовёт win(it), когда собрана. Проигрыша нет ни в одной.
const GAMES = {
  memory(it, box) {
    const cards = shuffle(it.pairs.flatMap(([q, a], k) => [{ k, t: q, c: 'q' }, { k, t: a, c: 'a' }]));
    box.innerHTML = '<div class="mem">' + cards.map((c, i) =>
      `<button class="mc ${c.c}" data-i="${i}" aria-label="Карточка"><span>${esc(c.t)}</span></button>`).join('') +
      '</div><p class="note" id="note"></p>';
    const btns = [...box.querySelectorAll('.mc')];
    let open = [], got = 0;
    btns.forEach((b, i) => b.onclick = () => {
      if (open.length === 2 || b.classList.contains('open') || b.classList.contains('got')) return;
      b.classList.add('open'); open.push(i);
      if (open.length < 2) return;
      const [x, y] = open;
      if (cards[x].k === cards[y].k) {
        [x, y].forEach(j => btns[j].classList.replace('open', 'got'));
        box.querySelector('#note').textContent = it.pairs[cards[x].k][2];
        open = [];
        if (++got === it.pairs.length) setTimeout(() => win(it), 1600);
      } else setTimeout(() => { [x, y].forEach(j => btns[j].classList.remove('open')); open = []; }, 1000);
    });
  },

  quiz(it, box) {
    let n = 0;
    const show = () => {
      const x = it.qs[n];
      box.innerHTML = `<p class="kicker" style="margin-top:8px">${n + 1} из ${it.qs.length}</p><h3>${esc(x.q)}</h3>` +
        x.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('') + '<p class="note" id="note"></p>';
      const opts = [...box.querySelectorAll('.opt')];
      opts.forEach((b, i) => b.onclick = () => {
        if (x.ok !== 'all' && i !== x.ok) { b.classList.add('no'); b.disabled = true; return; }
        opts.forEach((o, j) => { o.disabled = true; if (x.ok === 'all' || j === i) o.classList.add('yes'); });
        box.querySelector('#note').textContent = x.note;
        const go = document.createElement('button');
        go.className = 'btn'; go.textContent = n + 1 < it.qs.length ? 'Дальше' : 'Готово';
        go.onclick = () => ++n < it.qs.length ? show() : win(it);
        box.appendChild(go);
      });
    };
    show();
  },

  puzzle(it, box) {
    let order, sel = -1;
    do order = shuffle([...Array(9).keys()]); while (order.every((v, i) => v === i));
    const draw = () => {
      box.innerHTML = '<div class="pz">' + order.map((v, i) =>
        `<button class="pt${i === sel ? ' sel' : ''}" data-i="${i}" aria-label="Кусочек"
          style="background-image:url(${it.photo});background-position:${v % 3 * 50}% ${(v / 3 | 0) * 50}%"></button>`).join('') + '</div>';
      box.querySelectorAll('.pt').forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        if (sel < 0) sel = i;
        else { [order[sel], order[i]] = [order[i], order[sel]]; sel = -1; }
        draw();
        if (order.every((v, k) => v === k)) { box.querySelector('.pz').classList.add('whole'); setTimeout(() => win(it), 1400); }
      });
    };
    draw();
  },

  hug(it, box) {
    const d = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
    box.innerHTML = `<div class="heart" id="heart"><svg viewBox="0 0 24 24" aria-hidden="true">
      <defs><clipPath id="hc"><rect id="hf" x="0" y="21.4" width="24" height="24"/></clipPath></defs>
      <path d="${d}" fill="#f3dfe4"/><path d="${d}" fill="#c9788b" clip-path="url(#hc)"/></svg>
      <p class="muted">Держи палец здесь</p></div>`;
    const heart = box.querySelector('#heart'), fill = box.querySelector('#hf');
    let p = 0, timer = 0;
    const stop = () => { clearInterval(timer); heart.classList.remove('on'); };
    heart.onpointerdown = e => {
      heart.setPointerCapture(e.pointerId); heart.classList.add('on');
      clearInterval(timer);
      timer = setInterval(() => {
        p = Math.min(1, p + 50 / it.ms);
        fill.setAttribute('y', 21.4 - 18.5 * p);
        if (p >= 1) { stop(); heart.onpointerdown = null; navigator.vibrate?.(200); setTimeout(() => win(it), 500); }
      }, 50);
    };
    heart.onpointerup = heart.onpointercancel = stop;
    heart.oncontextmenu = e => e.preventDefault();
  },

  word(it, box) {
    let tiles;
    do tiles = shuffle([...it.word]); while (tiles.join('') === it.word);
    const slots = [];
    const draw = wrong => {
      box.innerHTML = `<div class="slots${wrong ? ' shake' : ''}">` + [...it.word].map((_, k) =>
        `<button class="lt slot" data-k="${k}" aria-label="Место ${k + 1}">${slots[k] != null ? tiles[slots[k]] : ''}</button>`).join('') +
        '</div><div class="tiles">' + tiles.map((c, i) =>
        `<button class="lt" data-i="${i}"${slots.includes(i) ? ' disabled' : ''}>${c}</button>`).join('') + '</div>' +
        (wrong ? '<p class="note">Почти. Нажми на букву сверху, и она вернётся вниз.</p>' : '');
      box.querySelectorAll('.slot').forEach(b => b.onclick = () => { if (slots[+b.dataset.k] != null) { slots.splice(+b.dataset.k, 1); draw(); } });
      box.querySelectorAll('.tiles .lt').forEach(b => b.onclick = () => {
        slots.push(+b.dataset.i);
        if (slots.length < it.word.length) return draw();
        if (slots.map(i => tiles[i]).join('') === it.word) { draw(); setTimeout(() => win(it), 500); }
        else draw(true);
      });
    };
    draw();
  },
};

// Купон под фольгой: стирается пальцем, на половине слетает сам.
function scratch(el) {
  const r = el.getBoundingClientRect(), dpr = devicePixelRatio || 1, c = document.createElement('canvas');
  c.className = 'foil'; c.width = r.width * dpr; c.height = r.height * dpr;
  c.style.width = r.width + 'px'; c.style.height = r.height + 'px';
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  x.fillStyle = '#dcb3bd'; x.fillRect(0, 0, r.width, r.height);
  x.fillStyle = '#fff'; x.font = '600 16px -apple-system, sans-serif'; x.textAlign = 'center';
  x.fillText('Сотри пальцем', r.width / 2, r.height / 2 + 6);
  x.globalCompositeOperation = 'destination-out'; x.lineWidth = 38; x.lineCap = x.lineJoin = 'round';
  let last = null, n = 0;
  const at = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const cleared = () => {
    const a = x.getImageData(0, 0, c.width, c.height).data;
    let z = 0, t = 0;
    for (let i = 3; i < a.length; i += 80) { t++; if (!a[i]) z++; }
    return z / t;
  };
  const rub = e => {
    if (!last) return;
    const p = at(e);
    x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last = p;
    if (++n % 8 === 0 && cleared() > .5) { c.onpointermove = null; c.classList.add('gone'); setTimeout(() => c.remove(), 400); }
  };
  c.onpointerdown = e => { last = at(e); c.setPointerCapture(e.pointerId); rub(e); };
  c.onpointermove = rub;
  c.onpointerup = c.onpointercancel = () => last = null;
  el.appendChild(c);
}

function bind(it) {
  document.querySelectorAll('[data-scratch]').forEach(scratch);
  const send = document.getElementById('send');
  if (send) send.onclick = () => {
    const v = document.getElementById('ans').value.trim();
    if (!v) return document.getElementById('ans').focus();
    S.answers[it.id] = v; S.phase = 'code'; save(); render();
  };
  const go = document.getElementById('go');
  if (go) {
    const inp = document.getElementById('code');
    const check = async () => {
      if ((await sha(inp.value.trim())) === it.h) {
        confetti();
        if (it.type === 'gate') return next();
        collect(it); S.phase = 'done'; save(); render();
      } else {
        document.getElementById('msg').textContent = 'Этот код не подходит. Спроси у меня ещё раз.';
        inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
      }
    };
    go.onclick = check;
    inp.onkeydown = e => { if (e.key === 'Enter') check(); };
  }
}

function next() {
  const it = FLOW[S.i];
  if (it.type === 'show') collect(it);
  S.i = Math.min(S.i + 1, FLOW.length - 1); S.phase = 'ask'; save(); render();
}

function openWallet() {
  document.getElementById('walletBody').innerHTML = `<h2>Твои купоны</h2>` +
    S.coupons.map(c => `<div class="coupon">${esc(c)}</div>`).join('') +
    (S.letters.length ? `<p class="kicker" style="margin-top:18px;text-align:center">Буквы · ${S.letters.length} из ${LETTERS}</p>
      <div class="tiles">${S.letters.map(l => `<span class="lt">${esc(l)}</span>`).join('')}</div>` : '') +
    `<p class="muted" style="text-align:center;margin-top:12px">Чтобы воспользоваться, покажи мне экран.</p>
     <button class="btn" onclick="wallet.classList.remove('open')">Закрыть</button>`;
  wallet.classList.add('open');
}
wallet.onclick = e => { if (e.target === wallet) wallet.classList.remove('open'); };

function confetti() {
  const box = document.getElementById('confetti');
  const colors = ['#e9b8c3', '#c9788b', '#aac6e8', '#f3d9a4', '#ffffff'];
  box.innerHTML = Array.from({ length: 60 }, () => {
    const d = 1.6 + Math.random() * 1.6;
    return `<i style="left:${Math.random() * 100}%;background:${colors[Math.random() * 5 | 0]};
      --dx:${(Math.random() - .5) * 120}px;--r:${Math.random() * 720}deg;
      animation-duration:${d}s;animation-delay:${Math.random() * .4}s"></i>`;
  }).join('');
  setTimeout(() => box.innerHTML = '', 3400);
}

render();
</script>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14123a">
<title>2 октября</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
/*
  THESIS: день рождения как одно небо. Сайт окрашен в небо той части дня, где она сейчас:
  ночь, утро, день, вечер. Прогресс — путь солнца и луны по дуге сверху. Отказ от плоской
  открытки на кремовом фоне.
  OWN-WORLD: палитра гортензий и неба — индиго ночи, персик утра, голубой дня, сиреневый закат.
  Сплошные карточки, купоны-билеты с вырезами, фольга-перламутр, буквы-плитки, лепестки вместо конфетти.
  Yeseva One для слов от сердца, Rubik для всего остального.
  STORY: она видит, где она в своём дне, что уже было и что её ждёт, и может пересмотреть каждое видео.
  FIRST VIEWPORT: дуга дня с луной во всю ширину, под ней крупный заголовок и одна кнопка.
*/
  :root { color-scheme: light dark; }
  body[data-part="Ночь"] {
    --card: #221e57; --ink: #f6f1fb; --ink2: #bdb5df; --accent: #f4b9d0; --on-accent: #2a1840;
    --line: rgba(255,255,255,.14); --field: #18154a; --soft: #342c74; --soft-ink: #f6e3ee; --orb: #fff1cf;
  }
  body[data-part="Утро"] {
    --card: #fffaf7; --ink: #3a1f31; --ink2: #7a5566; --accent: #c2447a; --on-accent: #fff;
    --line: #f0d8d6; --field: #fff; --soft: #ffe4ea; --soft-ink: #6d2446; --orb: #ffb36b;
  }
  body[data-part="День"] {
    --card: #ffffff; --ink: #19284d; --ink2: #4d5d86; --accent: #3a60c2; --on-accent: #fff;
    --line: #d5e1f5; --field: #fff; --soft: #e2ebfd; --soft-ink: #1f3a85; --orb: #ffd166;
  }
  body[data-part="Вечер"] {
    --card: #2b2058; --ink: #fcf2f7; --ink2: #d3c0de; --accent: #ffc6a5; --on-accent: #3a1f44;
    --line: rgba(255,255,255,.16); --field: #21184a; --soft: #463371; --soft-ink: #ffe9dc; --orb: #ffe7c2;
  }
  * { box-sizing: border-box; }
  html { background: #14123a; }
  body {
    margin: 0; min-height: 100dvh; color: var(--ink);
    font: 17px/1.5 Rubik, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; transition: color .6s;
  }

  /* Небо: четыре слоя, виден слой текущей части дня. */
  .sky { position: fixed; inset: 0; z-index: -1; }
  .sky i { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s cubic-bezier(.2,.8,.2,1); }
  .sky .n { background: linear-gradient(180deg, #0f0d33 0%, #231d5e 55%, #4a3778 100%); }
  .sky .m { background: linear-gradient(180deg, #ffc2b4 0%, #ffe0d6 45%, #fff4ef 100%); }
  .sky .d { background: linear-gradient(180deg, #8fb6ef 0%, #c4daf8 50%, #eef4fe 100%); }
  .sky .e { background: linear-gradient(180deg, #2d2168 0%, #6c3f8e 45%, #c46d97 75%, #f3a99a 100%); }
  body[data-part="Ночь"] .sky .n, body[data-part="Утро"] .sky .m,
  body[data-part="День"] .sky .d, body[data-part="Вечер"] .sky .e { opacity: 1; }
  .stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s; }
  .stars b { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .25; } to { opacity: .9; } }
  body[data-part="Ночь"] .stars { opacity: 1; }
  body[data-part="Вечер"] .stars { opacity: .45; }

  main { max-width: 480px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }

  /* Дуга дня — прогресс. */
  .top { margin: 0 -4px 14px; }
  .arc { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .arc svg { display: block; width: 100%; height: auto; overflow: visible; }
  .arc .path { fill: none; stroke: currentColor; stroke-opacity: .28; stroke-width: 1.2; stroke-dasharray: 2 5; stroke-linecap: round; }
  .arc .done { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
  .arc .dot { fill: currentColor; fill-opacity: .3; }
  .arc .dot.on { fill: var(--accent); fill-opacity: 1; }
  .arc .orb { fill: var(--orb); filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
  .arc .crater { fill: #000; fill-opacity: .07; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: -6px; padding: 0 4px; font-size: 14px; color: var(--ink2); }
  .meta b { font-weight: 500; color: var(--ink); }
  .daybtn { border: 0; border-radius: 999px; padding: 8px 14px; background: var(--soft); color: var(--soft-ink); font: 500 14px Rubik, sans-serif; cursor: pointer; }
  .daybtn:active { transform: scale(.97); }

  .card { background: var(--card); border-radius: 28px; padding: 24px 20px 22px; box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 22px 48px -26px rgba(10, 6, 40, .55); animation: rise .6s cubic-bezier(.16,1,.3,1); transition: background .6s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); filter: blur(4px); } }
  .kicker { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 8px; }
  body[data-part="Утро"] .kicker, body[data-part="День"] .kicker { color: var(--accent); }
  h1, h2, h3 { font-family: "Yeseva One", ui-serif, Georgia, serif; font-weight: 400; line-height: 1.12; margin: 0 0 14px; text-wrap: balance; letter-spacing: -.005em; }
  h1 { font-size: clamp(38px, 11vw, 48px); }
  h2 { font-size: clamp(25px, 7vw, 30px); }
  h3 { font-size: 22px; margin-bottom: 12px; }
  p { margin: 0 0 12px; text-wrap: pretty; }
  .muted { color: var(--ink2); font-size: 15px; }
  .quote { margin: -2px 0 16px; padding: 12px 14px; border-radius: 16px; background: var(--soft); color: var(--soft-ink); font-style: italic; }

  .media { margin: 4px -8px 18px; border-radius: 20px; overflow: hidden; background: #000; }
  .media img, .media video { display: block; width: 100%; max-height: 72dvh; object-fit: contain; background: #000; }
  .media img { background: none; }
  .ph { aspect-ratio: 4 / 5; display: grid; place-items: center; color: #bbb; font-size: 14px; text-align: center; padding: 20px; }

  textarea, input {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 16px; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  textarea::placeholder, input::placeholder { color: var(--ink2); opacity: .8; }
  textarea { min-height: 96px; resize: vertical; }
  textarea:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  input.code { font: 600 32px Rubik, sans-serif; letter-spacing: .45em; text-indent: .45em; text-align: center; padding: 12px; }
  .btn {
    display: block; width: 100%; margin-top: 14px; border: 0; border-radius: 999px; padding: 17px 20px;
    font: 600 17px/1 Rubik, sans-serif; color: var(--on-accent); background: var(--accent); cursor: pointer;
    box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--accent) 80%, #000);
    transition: transform .15s cubic-bezier(.2,.8,.2,1), opacity .2s;
  }
  .btn:active { transform: scale(.975); }
  .btn[disabled] { opacity: .45; }
  .btn:focus-visible, .daybtn:focus-visible, .arc:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .link { display: block; margin: 14px auto 0; border: 0; background: none; color: var(--ink2); font: 15px Rubik, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .msg { min-height: 22px; margin-top: 10px; font-size: 15px; color: var(--accent); text-align: center; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .hero { padding: 30px 22px 22px; }
  .hero.first { min-height: min(68dvh, 560px); display: flex; flex-direction: column; justify-content: flex-end; }
  .hero.first h1 { font-size: clamp(46px, 14vw, 60px); line-height: 1.02; margin-bottom: 18px; }
  .hero .date { font: 400 19px "Yeseva One", serif; color: var(--accent); margin: 0 0 10px; }

  .reward { text-align: center; padding: 4px 0 0; }
  .reward h2 { font-size: clamp(28px, 8vw, 34px); }

  /* Купон — билет с вырезами по бокам. */
  .coupon {
    position: relative; margin: 16px auto 6px; max-width: 320px; padding: 18px 26px; border-radius: 16px; text-align: center;
    background: var(--soft); color: var(--soft-ink); font: 400 23px/1.2 "Yeseva One", serif;
    -webkit-mask: radial-gradient(circle 11px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 11px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 11px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 11px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat;
  }
  .coupon::after { content: ''; position: absolute; left: 22px; right: 22px; bottom: 9px; border-bottom: 1.5px dashed currentColor; opacity: .25; }
  .coupon small { display: block; font: 600 12px Rubik, sans-serif; letter-spacing: .1em; text-transform: uppercase; opacity: .7; margin-bottom: 6px; }
  .foil { position: absolute; left: 0; top: 0; touch-action: none; cursor: pointer; transition: opacity .5s, filter .5s; }
  .foil.gone { opacity: 0; filter: blur(6px); }

  .letter { width: 72px; height: 80px; margin: 20px auto 8px; display: grid; place-items: center; border-radius: 18px; background: var(--accent); color: var(--on-accent); font: 400 40px "Yeseva One", serif; box-shadow: 0 12px 24px -12px rgba(0,0,0,.45); animation: pop .7s cubic-bezier(.2,1.6,.4,1) .2s backwards; }
  @keyframes pop { from { transform: scale(.4) rotate(-12deg); opacity: 0; } }
  .note { min-height: 44px; margin: 12px 0 0; text-align: center; color: var(--accent); font-size: 15px; }
  #game button { -webkit-tap-highlight-color: transparent; }

  .mem { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .mc { min-height: 100px; padding: 8px 6px; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-family: inherit; font-size: 13px; line-height: 1.25; cursor: pointer; }
  .mc::before { content: '✿'; font-size: 26px; opacity: .85; }
  .mc span { display: none; }
  .mc.open, .mc.got { background: var(--field); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); animation: flip .3s; }
  .mc.open::before, .mc.got::before { content: none; }
  .mc.open span, .mc.got span { display: block; }
  .mc.q.open, .mc.q.got { background: var(--soft); color: var(--soft-ink); }
  .mc.a span { font: 17px/1.15 "Yeseva One", serif; }
  .mc.got { box-shadow: inset 0 0 0 2px var(--accent); }
  @keyframes flip { 50% { transform: scaleX(0); } }

  .opt { display: block; width: 100%; min-height: 50px; margin-top: 8px; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--field); color: var(--ink); font-family: inherit; font-size: 16px; line-height: 1.3; text-align: left; cursor: pointer; transition: opacity .3s, background .3s, border-color .3s; }
  .opt.no { opacity: .3; text-decoration: line-through; }
  .opt.yes { background: var(--soft); color: var(--soft-ink); border-color: var(--accent); opacity: 1; }

  .pz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; aspect-ratio: 4 / 3; margin: 4px -8px 0; border-radius: 20px; overflow: hidden; transition: gap .5s; }
  .pz.whole { gap: 0; }
  .pt { border: 0; padding: 0; background-size: 300% 300%; cursor: pointer; }
  .pt.sel { box-shadow: inset 0 0 0 4px var(--accent); }

  .heart { display: grid; justify-items: center; margin: 8px auto 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; cursor: pointer; }
  .heart svg { width: 210px; height: 210px; transition: transform .3s; }
  .heart.on svg { transform: scale(1.07); animation: beat 1s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.12); } }
  .heart .bg { fill: var(--soft); } .heart .fg { fill: var(--accent); }

  .slots, .tiles { display: flex; justify-content: center; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  .lt { display: grid; place-items: center; width: 52px; height: 60px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font: 400 28px "Yeseva One", serif; cursor: pointer; }
  .lt[disabled] { opacity: .12; }
  .lt.slot { background: var(--field); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
  .lt.empty { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink2); font: 500 20px Rubik, sans-serif; }

  .list { list-style: none; padding: 0; margin: 0 0 16px; text-align: left; }
  .list li { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border: 0; }
  .list b { display: block; font-size: 13px; color: var(--ink2); font-weight: 500; margin-bottom: 2px; }

  /* Лист «Наш день». */
  .sheet { position: fixed; inset: 0; background: rgba(12, 8, 40, .45); display: none; align-items: flex-end; z-index: 5; }
  .sheet.open { display: flex; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  .sheet > .card { width: 100%; max-width: 480px; margin: 0 auto; border-radius: 28px 28px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom)); max-height: 88dvh; overflow: auto; animation: up .4s cubic-bezier(.16,1,.3,1); }
  @keyframes up { from { transform: translateY(40%); } }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: -10px auto 14px; }
  .sec { font: 600 13px Rubik, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin: 24px 0 8px; }
  .part { display: flex; align-items: center; gap: 10px; margin: 18px 0 4px; font: 400 20px "Yeseva One", serif; }
  .part i { width: 28px; height: 28px; border-radius: 50%; flex: none; }
  .part small { font: 14px Rubik, sans-serif; color: var(--ink2); }
  .tl { list-style: none; margin: 0 0 0 13px; padding: 0 0 0 23px; border-left: 2px solid var(--line); }
  .tl li { position: relative; padding: 9px 0; }
  .tl li::before { content: ''; position: absolute; left: -31px; top: 14px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); }
  .tl li.done::before { background: var(--accent); box-shadow: none; }
  .tl li.now::before { background: var(--card); box-shadow: inset 0 0 0 4px var(--accent); }
  .tl li.later { color: var(--ink2); }
  .tl .t { font-weight: 500; }
  .tl .a { display: block; font-size: 14px; color: var(--ink2); font-style: italic; }
  .tl .re { display: block; margin-top: 6px; border: 0; border-radius: 999px; padding: 6px 12px; background: var(--soft); color: var(--soft-ink); font: 500 13px Rubik, sans-serif; cursor: pointer; }
  .tl .media { margin: 8px 0 4px; }
  .mini { display: flex; flex-wrap: wrap; gap: 8px; }
  .mini .coupon { margin: 0; flex: 1 1 140px; font-size: 18px; padding: 14px 20px; }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .confetti i { position: absolute; top: -16px; width: 12px; height: 12px; border-radius: 60% 0 60% 0; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--r)); } }
  @media (prefers-reduced-motion: reduce) { .card, .letter, .sheet > .card, .confetti i, .stars b, .heart.on svg { animation: none; } .confetti { display: none; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="n"></i><i class="m"></i><i class="d"></i><i class="e"></i><div class="stars" id="stars"></div></div>
<main id="app"></main>
<div class="sheet" id="wallet"><div class="card" id="walletBody"></div></div>
<div class="confetti" id="confetti"></div>

<script>
// Тексты — из ../тексты.md. Правки вносить там, потом сюда.
// h — sha256 кода из ../коды.md.
// ponytail: 4-значный код в sha256 перебирается за секунду — защита от подглядывания, не от взлома.
const FLOW = [

const KEY = 'dr-2026-10-02';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
const S = load() || { i: 0, answers: {}, coupons: [], phase: 'ask' };
S.letters ||= [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const LETTERS = FLOW.filter(x => x.letter).length;

async function sha(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

function media(it) {
  let h = '';
  if (it.video) h += `<div class="media"><video src="${it.video}" controls playsinline preload="metadata"
      onerror="this.parentNode.innerHTML='<div class=ph>Здесь будет видео</div>'"></video></div>`;
  if (it.photo) h += `<div class="media"><img src="${it.photo}" alt=""
      onerror="this.parentNode.innerHTML='<div class=ph>Здесь будет фото</div>'"></div>`;
  return h;
}

const KZ = { 'Ночь': 'Түн', 'Утро': 'Таң', 'День': 'Күн', 'Вечер': 'Кеш' };
const SKY = { 'Ночь': '#2b2468', 'Утро': '#ffc9b8', 'День': '#a9c8f2', 'Вечер': '#b0638f' };
const MOMENTS = FLOW.filter(x => x.type !== 'intro' && x.type !== 'final');
const partOf = it => it.part || (it.type === 'final' ? 'Вечер' : 'Ночь');

// Дуга дня: точка на каждый момент, солнце или луна стоит на текущем.
function bar(it) {
  const n = MOMENTS.length, done = FLOW.slice(0, S.i).filter(x => MOMENTS.includes(x)).length;
  const pt = t => [8 + 304 * t, 74 - 128 * t * (1 - t)];  // парабола 8..312, вершина y≈42
  const tOf = k => (k + .5) / n;
  const dots = MOMENTS.map((_, k) => { const [x, y] = pt(tOf(k)); return `<circle class="dot${k < done ? ' on' : ''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${k < done ? 2.6 : 2}"/>`; }).join('');
  const t = tOf(Math.min(done, n - 1)), [ox, oy] = pt(t);
  const trail = Array.from({ length: 41 }, (_, k) => pt(t * k / 40).map(v => v.toFixed(1)).join(',')).join(' ');
  const part = partOf(it), moon = part === 'Ночь' || part === 'Вечер';
  const orb = moon
    ? `<circle class="orb" cx="${ox}" cy="${oy}" r="9"/><circle class="crater" cx="${ox + 2.5}" cy="${oy - 2}" r="2.2"/><circle class="crater" cx="${ox - 3}" cy="${oy + 3}" r="1.4"/>`
    : `<circle class="orb" cx="${ox}" cy="${oy}" r="10"/>`;
  const badge = S.coupons.length + S.letters.length;
  return `<div class="top"><button class="arc" onclick="openDay()" aria-label="Наш день: ${done} из ${n}">
      <svg viewBox="0 0 320 84" aria-hidden="true"><polyline class="path" points="${Array.from({ length: 41 }, (_, k) => pt(k / 40).map(v => v.toFixed(1)).join(',')).join(' ')}"/>
      ${done ? `<polyline class="done" points="${trail}"/>` : ''}${dots}${orb}</svg></button>
    <div class="meta"><span><b>${KZ[part]}</b> · ${part.toLowerCase()} · ${done} из ${n}</span>
      <button class="daybtn" onclick="openDay()">Наш день${badge ? ' · ' + badge : ''}</button></div></div>`;
}

function codeBox(label) {
  return `<p class="muted">${label}</p>
    <input class="code" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····">
    <button class="btn" id="go">Открыть</button><div class="msg" id="msg"></div>`;
}

function render() {
  const it = FLOW[S.i];
  document.body.dataset.part = partOf(it);
  window.scrollTo(0, 0);
  let h = '';

  if (it.type === 'intro') {
    h = bar(it) + `<div class="card hero first"><p class="date">2 қазан</p><h1>${esc(it.title)}</h1><p>${esc(it.text)}</p>
      <button class="btn" onclick="next()">${esc(it.btn)}</button>
      <div id="restore"><button class="link" onclick="restoreBox()">Уже начинала на другом телефоне?</button></div></div>`;
  }

  if (it.type === 'step') {
    h = bar(it) + '<div class="card">' + media(it) + `<h2>${esc(it.q)}</h2>`;
    if (S.phase === 'ask') {
      h += `<textarea id="ans" placeholder="Напиши здесь">${esc(S.answers[it.id] || '')}</textarea>
        <button class="btn" id="send">Ответить</button>`;
    } else if (S.phase === 'code') {
      h += `<p class="quote">«${esc(S.answers[it.id])}»</p>` + codeBox('Записал. Теперь код, он у меня.');
    } else {
      h += reward(it);
    }
    h += '</div>';
  }

  if (it.type === 'gate') {
    h = bar(it) + `<div class="card"><h2>${esc(it.title)}</h2><p>${esc(it.text)}</p>` + codeBox('Код:') + '</div>';
  }

  if (it.type === 'show') {
    h = bar(it) + '<div class="card">' + (it.kicker ? `<p class="kicker">${esc(it.kicker)}</p>` : '') +
      (it.title ? `<h2>${esc(it.title)}</h2>` : '') + media(it) + (it.text ? `<p>${esc(it.text)}</p>` : '');
    if (it.coupon) h += `<div class="coupon" data-scratch><small>Купон</small>${esc(it.coupon)}</div>`;
    h += `<button class="btn" onclick="next()">${esc(it.btn || 'Әрі қарай')}</button></div>`;
  }

  if (GAMES[it.type]) {
    h = bar(it) + '<div class="card">' + (S.phase === 'done' ? reward(it) :
      `<p class="kicker">${esc(it.kicker)}</p><h2>${esc(it.title)}</h2><p class="muted">${esc(it.text)}</p><div id="game"></div>`) + '</div>';
  }

  if (it.type === 'final') {
    const answers = FLOW.filter(x => x.q && S.answers[x.id])
      .map(x => `<li><b>${esc(x.q)}</b>${esc(S.answers[x.id])}</li>`).join('');
    h = bar(it) + `<div class="card hero"><p class="date">2 қазан</p><h1>${esc(it.title)}</h1>
      ${S.coupons.length ? `<p class="sec">Твои купоны</p><div class="mini">` + S.coupons.map(c => `<div class="coupon"><small>Купон</small>${esc(c)}</div>`).join('') + '</div>' : ''}
      ${answers ? `<p class="sec">Твои ответы сегодня</p><ul class="list">${answers}</ul>` : ''}
      <button class="btn" onclick="openDay()">Пересмотреть весь день</button></div>`;
  }

  app.innerHTML = h;
  if (GAMES[it.type] && S.phase !== 'done') GAMES[it.type](it, document.getElementById('game'));
  bind(it);
}

function reward(it) {
  const n = S.letters.indexOf(it.letter) + 1;
  return `<div class="reward">
    ${it.rewardTitle ? `<h2>${esc(it.rewardTitle)}</h2>` : ''}
    ${it.rewardPhoto ? media({ photo: it.rewardPhoto }) : ''}
    ${it.coupon ? `<div class="coupon" data-scratch><small>Купон</small>${esc(it.coupon)}</div>` : ''}
    ${it.rewardText ? `<p class="muted">${esc(it.rewardText)}</p>` : ''}
    ${n ? `<div class="letter">${esc(it.letter)}</div><p class="muted">Буква ${n} из ${LETTERS}.${n === 1 ? ' Вечером соберёшь из них слово.' : ''}</p>` : ''}
    <button class="btn" onclick="next()">Әрі қарай</button></div>`;
}

// Кладёт купон и букву шага в копилку. Повторный вызов ничего не дублирует.
function collect(it) {
  if (it.coupon && !S.coupons.includes(it.coupon)) S.coupons.push(it.coupon);
  if (it.letter && !S.letters.includes(it.letter)) S.letters.push(it.letter);
}

function win(it) { confetti(); collect(it); S.phase = 'done'; save(); render(); }

// Каждая игра рисует себя в box и зовёт win(it), когда собрана. Проигрыша нет ни в одной.
const GAMES = {
  memory(it, box) {
    const cards = shuffle(it.pairs.flatMap(([q, a], k) => [{ k, t: q, c: 'q' }, { k, t: a, c: 'a' }]));
    box.innerHTML = '<div class="mem">' + cards.map((c, i) =>
      `<button class="mc ${c.c}" data-i="${i}" aria-label="Карточка"><span>${esc(c.t)}</span></button>`).join('') +
      '</div><p class="note" id="note"></p>';
    const btns = [...box.querySelectorAll('.mc')];
    let open = [], got = 0;
    btns.forEach((b, i) => b.onclick = () => {
      if (open.length === 2 || b.classList.contains('open') || b.classList.contains('got')) return;
      b.classList.add('open'); open.push(i);
      if (open.length < 2) return;
      const [x, y] = open;
      if (cards[x].k === cards[y].k) {
        [x, y].forEach(j => btns[j].classList.replace('open', 'got'));
        box.querySelector('#note').textContent = it.pairs[cards[x].k][2];
        open = [];
        if (++got === it.pairs.length) setTimeout(() => win(it), 1600);
      } else setTimeout(() => { [x, y].forEach(j => btns[j].classList.remove('open')); open = []; }, 1000);
    });
  },

  quiz(it, box) {
    let n = 0;
    const show = () => {
      const x = it.qs[n];
      box.innerHTML = `<p class="kicker" style="margin-top:8px">${n + 1} из ${it.qs.length}</p><h3>${esc(x.q)}</h3>` +
        x.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('') + '<p class="note" id="note"></p>';
      const opts = [...box.querySelectorAll('.opt')];
      opts.forEach((b, i) => b.onclick = () => {
        if (x.ok !== 'all' && i !== x.ok) { b.classList.add('no'); b.disabled = true; return; }
        opts.forEach((o, j) => { o.disabled = true; if (x.ok === 'all' || j === i) o.classList.add('yes'); });
        box.querySelector('#note').textContent = x.note;
        const go = document.createElement('button');
        go.className = 'btn'; go.textContent = n + 1 < it.qs.length ? 'Дальше' : 'Готово';
        go.onclick = () => ++n < it.qs.length ? show() : win(it);
        box.appendChild(go);
      });
    };
    show();
  },

  puzzle(it, box) {
    let order, sel = -1;
    do order = shuffle([...Array(9).keys()]); while (order.every((v, i) => v === i));
    const draw = () => {
      box.innerHTML = '<div class="pz">' + order.map((v, i) =>
        `<button class="pt${i === sel ? ' sel' : ''}" data-i="${i}" aria-label="Кусочек"
          style="background-image:url(${it.photo});background-position:${v % 3 * 50}% ${(v / 3 | 0) * 50}%"></button>`).join('') + '</div>';
      box.querySelectorAll('.pt').forEach(b => b.onclick = () => {
        const i = +b.dataset.i;
        if (sel < 0) sel = i;
        else { [order[sel], order[i]] = [order[i], order[sel]]; sel = -1; }
        draw();
        if (order.every((v, k) => v === k)) { box.querySelector('.pz').classList.add('whole'); setTimeout(() => win(it), 1400); }
      });
    };
    draw();
  },

  hug(it, box) {
    const d = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
    box.innerHTML = `<div class="heart" id="heart"><svg viewBox="0 0 24 24" aria-hidden="true">
      <defs><clipPath id="hc"><rect id="hf" x="0" y="21.4" width="24" height="24"/></clipPath></defs>
      <path class="bg" d="${d}"/><path class="fg" d="${d}" clip-path="url(#hc)"/></svg>
      <p class="muted">Держи палец здесь</p></div>`;
    const heart = box.querySelector('#heart'), fill = box.querySelector('#hf');
    let p = 0, timer = 0;
    const stop = () => { clearInterval(timer); heart.classList.remove('on'); };
    heart.onpointerdown = e => {
      heart.setPointerCapture(e.pointerId); heart.classList.add('on');
      clearInterval(timer);
      timer = setInterval(() => {
        p = Math.min(1, p + 50 / it.ms);
        fill.setAttribute('y', 21.4 - 18.5 * p);
        if (p >= 1) { stop(); heart.onpointerdown = null; navigator.vibrate?.(200); setTimeout(() => win(it), 500); }
      }, 50);
    };
    heart.onpointerup = heart.onpointercancel = stop;
    heart.oncontextmenu = e => e.preventDefault();
  },

  word(it, box) {
    let tiles;
    do tiles = shuffle([...it.word]); while (tiles.join('') === it.word);
    const slots = [];
    const draw = wrong => {
      box.innerHTML = `<div class="slots${wrong ? ' shake' : ''}">` + [...it.word].map((_, k) =>
        `<button class="lt slot" data-k="${k}" aria-label="Место ${k + 1}">${slots[k] != null ? tiles[slots[k]] : ''}</button>`).join('') +
        '</div><div class="tiles">' + tiles.map((c, i) =>
        `<button class="lt" data-i="${i}"${slots.includes(i) ? ' disabled' : ''}>${c}</button>`).join('') + '</div>' +
        (wrong ? '<p class="note">Почти. Нажми на букву сверху, и она вернётся вниз.</p>' : '');
      box.querySelectorAll('.slot').forEach(b => b.onclick = () => { if (slots[+b.dataset.k] != null) { slots.splice(+b.dataset.k, 1); draw(); } });
      box.querySelectorAll('.tiles .lt').forEach(b => b.onclick = () => {
        slots.push(+b.dataset.i);
        if (slots.length < it.word.length) return draw();
        if (slots.map(i => tiles[i]).join('') === it.word) { draw(); setTimeout(() => win(it), 500); }
        else draw(true);
      });
    };
    draw();
  },
};

// Купон под фольгой: стирается пальцем, на половине слетает сам.
function scratch(el) {
  const r = el.getBoundingClientRect(), dpr = devicePixelRatio || 1, c = document.createElement('canvas');
  c.className = 'foil'; c.width = r.width * dpr; c.height = r.height * dpr;
  c.style.width = r.width + 'px'; c.style.height = r.height + 'px';
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  const g = x.createLinearGradient(0, 0, r.width, r.height);
  ['#f3c9dc', '#cdd9f7', '#f7e4bd', '#dcc8f3', '#f3c9dc'].forEach((col, k) => g.addColorStop(k / 4, col));
  x.fillStyle = g; x.fillRect(0, 0, r.width, r.height);
  for (let k = 0; k < r.width * r.height / 40; k++) {
    x.fillStyle = `rgba(255,255,255,${Math.random() * .5})`; x.fillRect(Math.random() * r.width, Math.random() * r.height, 1.2, 1.2);
  }
  x.fillStyle = '#5b3f6e'; x.font = '600 15px Rubik, -apple-system, sans-serif'; x.textAlign = 'center';
  x.fillText('Сотри пальцем ✦', r.width / 2, r.height / 2 + 5);
  x.globalCompositeOperation = 'destination-out'; x.lineWidth = 38; x.lineCap = x.lineJoin = 'round';
  let last = null, n = 0;
  const at = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const cleared = () => {
    const a = x.getImageData(0, 0, c.width, c.height).data;
    let z = 0, t = 0;
    for (let i = 3; i < a.length; i += 80) { t++; if (!a[i]) z++; }
    return z / t;
  };
  const rub = e => {
    if (!last) return;
    const p = at(e);
    x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last = p;
    if (++n % 8 === 0 && cleared() > .5) { c.onpointermove = null; c.classList.add('gone'); setTimeout(() => c.remove(), 400); }
  };
  c.onpointerdown = e => { last = at(e); c.setPointerCapture(e.pointerId); rub(e); };
  c.onpointermove = rub;
  c.onpointerup = c.onpointercancel = () => last = null;
  el.appendChild(c);
}

function bind(it) {
  document.querySelectorAll('[data-scratch]').forEach(scratch);
  const send = document.getElementById('send');
  if (send) send.onclick = () => {
    const v = document.getElementById('ans').value.trim();
    if (!v) return document.getElementById('ans').focus();
    S.answers[it.id] = v; S.phase = 'code'; save(); render();
  };
  const go = document.getElementById('go');
  if (go) {
    const inp = document.getElementById('code');
    const check = async () => {
      if ((await sha(inp.value.trim())) === it.h) {
        confetti();
        if (it.type === 'gate') return next();
        collect(it); S.phase = 'done'; save(); render();
      } else {
        document.getElementById('msg').textContent = 'Этот код не подходит. Спроси у меня ещё раз.';
        inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
      }
    };
    go.onclick = check;
    inp.onkeydown = e => { if (e.key === 'Enter') check(); };
  }
}

function next() {
  const it = FLOW[S.i];
  if (it.type === 'show') collect(it);
  S.i = Math.min(S.i + 1, FLOW.length - 1); S.phase = 'ask'; save(); render();
}

// Лист «Наш день»: купоны, буквы и все моменты по частям дня. Пройденное можно пересмотреть.
function openDay() {
  const now = FLOW[S.i];
  const letters = Array.from({ length: LETTERS }, (_, k) => S.letters[k]
    ? `<span class="lt">${esc(S.letters[k])}</span>` : `<span class="lt empty">?</span>`).join('');
  const parts = ['Ночь', 'Утро', 'День', 'Вечер'].map(p => {
    const rows = MOMENTS.filter(x => x.part === p).map(x => {
      const k = FLOW.indexOf(x), st = k < S.i ? 'done' : x === now ? 'now' : 'later';
      if (st === 'later') return `<li class="later"><span class="t">Сюрприз</span></li>`;
      const ans = S.answers[x.id] ? `<span class="a">«${esc(S.answers[x.id])}»</span>` : '';
      const m = st === 'done' && (x.video || x.photo || x.rewardPhoto) ? `<button class="re" data-k="${k}">Пересмотреть</button>` : '';
      return `<li class="${st}"><span class="t">${esc(x.label)}</span>${st === 'now' ? ' <span class="muted">· сейчас</span>' : ''}${ans}${m}</li>`;
    }).join('');
    return `<div class="part"><i style="background:${SKY[p]}"></i>${KZ[p]} <small>${p.toLowerCase()}</small></div><ul class="tl">${rows}</ul>`;
  }).join('');
  walletBody.innerHTML = `<div class="grab"></div><h2>Наш день</h2>` +
    `<p class="sec">Купоны · ${S.coupons.length}</p>` +
    (S.coupons.length ? `<div class="mini">${S.coupons.map(c => `<div class="coupon"><small>Купон</small>${esc(c)}</div>`).join('')}</div>
      <p class="muted" style="margin-top:8px">Чтобы воспользоваться, покажи мне экран.</p>` : `<p class="muted">Первый купон будет совсем скоро.</p>`) +
    `<p class="sec">Буквы · ${S.letters.length} из ${LETTERS}</p><div class="tiles" style="justify-content:flex-start">${letters}</div>` +
    `<p class="sec">Моменты</p>${parts}<button class="btn" onclick="wallet.classList.remove('open')">Закрыть</button>`;
  walletBody.querySelectorAll('.re').forEach(b => b.onclick = () => {
    const x = FLOW[+b.dataset.k];
    b.outerHTML = media({ video: x.video, photo: x.photo || x.rewardPhoto });
  });
  wallet.classList.add('open');
  walletBody.scrollTop = 0;
}
wallet.onclick = e => { if (e.target === wallet) wallet.classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') wallet.classList.remove('open'); });

// Другой телефон или браузер: любой выданный код возвращает её на место, где этот код открылся.
function restoreBox() {
  restore.innerHTML = `<p class="muted" style="margin-top:16px">Введи последний код, который я тебе дал.</p>
    <input class="code" id="rcode" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····">
    <button class="btn" id="rgo">Вернуться на место</button><div class="msg" id="rmsg"></div>`;
  const inp = document.getElementById('rcode');
  const go = async () => {
    const hv = await sha(inp.value.trim()), k = FLOW.findIndex(x => x.h === hv);
    if (k < 0) { rmsg.textContent = 'Этот код не подходит. Спроси у меня ещё раз.'; return; }
    FLOW.slice(0, k + 1).forEach(collect);
    if (FLOW[k].type === 'gate') { S.i = k + 1; S.phase = 'ask'; } else { S.i = k; S.phase = 'done'; }
    save(); confetti(); render();
  };
  document.getElementById('rgo').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  inp.focus();
}

function confetti() {
  const box = document.getElementById('confetti');
  const colors = ['#f4b9d0', '#c2447a', '#a9c8f2', '#ffd8a8', '#cdb6f0'];
  box.innerHTML = Array.from({ length: 60 }, () => {
    const d = 1.6 + Math.random() * 1.6;
    return `<i style="left:${Math.random() * 100}%;width:${8 + Math.random() * 8 | 0}px;height:${8 + Math.random() * 8 | 0}px;background:${colors[Math.random() * 5 | 0]};
      --dx:${(Math.random() - .5) * 120}px;--r:${Math.random() * 720}deg;
      animation-duration:${d}s;animation-delay:${Math.random() * .4}s"></i>`;
  }).join('');
  setTimeout(() => box.innerHTML = '', 3400);
}

document.getElementById('stars').innerHTML = Array.from({ length: 70 }, () =>
  `<b style="left:${Math.random() * 100}%;top:${Math.random() * 70}%;animation-delay:${-Math.random() * 3}s;${Math.random() < .2 ? 'width:3px;height:3px' : ''}"></b>`).join('');
navigator.storage?.persist?.();
render();
</script>
